server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: playpadel
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
    tomcat:
      initial-size: 10
      max-active: 30
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  liquibase:
    change-log: classpath:db/liquibase-changelog-master.xml
